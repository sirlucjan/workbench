# ~/.config/scxtop/scxtop.toml
# NOTE: `S` (SaveConfig) rewrites this file and drops all comments.

# options: Default, MidnightGreen, IAmBlue, SolarizedDark,
# Greyscale, Nord, Dracula, Monokai, Gruvbox, TokyoNight,
# CatppuccinMocha, OneDark, AyuDark, USA
# (at runtime: `t` cycles through themes)
theme = "Nord"

tick_rate_ms = 250
frame_rate_ms = 100
debug = false
exclude_bpf = false

trace_file_prefix = "scxtop_trace"
trace_warmup_ms = 1000
trace_duration_ms = 5000

# Ignored on main @ e7ec880 (CLI default wins); use --default-profiling-event.
default_profiling_event = "cpu:cpu_total_util_percent"

# Required. "<alias>:<config_hex>:<perf_type>", core PMU only (type 4 on AMD).
perf_events = []

[keymap]
r = "RequestTrace"
c = "ClearEvent"
